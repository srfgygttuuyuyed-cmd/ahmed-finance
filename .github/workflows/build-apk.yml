name: Build AHMED FINANCE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          ZIP="AHMED_FINANCE_Android_FIXED.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP not found"; exit 1; }
          unzip -q "$ZIP" -d extracted
          PROJECT_SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found in ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHMED-FINANCE-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
